apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: task-manager
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: task-manager-dev

  template:
    metadata:
      name: task-manager-{{environment}}

    spec:
      project: task-manager

      source:
        repoURL: https://github.com/AryanAtel1034/fuildAi-Assesment.git
        targetRevision: main
        path: GitOps/env/{{environment}}

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
